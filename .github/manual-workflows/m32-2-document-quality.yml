name: M32.2 Compuerta documental completa

on:
  push:
    branches:
      - main
      - m32-2-compuerta-documental-completa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compuerta-y-renderizado:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      LEGAL_PROFILE: local
      LEGAL_ALLOW_DEMO_ACCOUNTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Ejecutar regresiones específicas M32.2
        run: python -m unittest discover -s tests -p 'test_m32_2_document_release_gate.py' -v

      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation

      - name: Generar seis muestras mediante fábricas activas
        run: python scripts/generate_m32_2_visual_samples.py --output "$RUNNER_TEMP/m32-2/samples"

      - name: Verificar cobertura, manifiestos y aprobación pendiente
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/m32-2/samples"
          for code in CO-TR-001 CO-TR-002 CO-SA-001 CO-CD-001 CO-CD-003 CO-CD-004; do
            count="$(find "$SAMPLES" -maxdepth 1 -type f -name "$code*_M32_2.docx" | wc -l | tr -d ' ')"
            test "$count" -eq 1
          done
          test "$(find "$SAMPLES" -maxdepth 1 -type f -name '*.docx' | wc -l | tr -d ' ')" -eq 6
          test "$(find "$SAMPLES" -maxdepth 1 -type f -name '*.docx.quality.json' | wc -l | tr -d ' ')" -eq 6
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          samples = Path(os.environ['RUNNER_TEMP']) / 'm32-2' / 'samples'
          products = set()
          for path in samples.glob('*.docx.quality.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload['quality']['valid'] is True
              assert payload['visual_preflight']['valid'] is True
              assert payload['approval_state'] == {'legal': 'pending', 'qa': 'pending'}
              assert payload['requires_human_visual_review'] is True
              products.add(payload['product_code'])
          assert products == {'CO-TR-001','CO-TR-002','CO-SA-001','CO-CD-001','CO-CD-003','CO-CD-004'}
          PY

      - name: Convertir DOCX a PDF y rasterizar todas las páginas
        env:
          HOME: ${{ runner.temp }}/lo-home-m32-2
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/m32-2/samples"
          RENDERED="$RUNNER_TEMP/m32-2/rendered"
          PROFILE="$RUNNER_TEMP/m32-2/lo-profile"
          mkdir -p "$HOME" "$RENDERED" "$PROFILE"
          : > "$RENDERED/page-counts.tsv"
          for docx in "$SAMPLES"/*.docx; do
            stem="$(basename "${docx%.docx}")"
            out="$RENDERED/$stem"
            mkdir -p "$out"
            libreoffice --headless "-env:UserInstallation=file://$PROFILE-$stem" --convert-to pdf --outdir "$out" "$docx"
            pdf="$out/$stem.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
            pdftoppm -png -r 120 "$pdf" "$out/page"
            rendered_pages="$(find "$out" -maxdepth 1 -type f -name 'page-*.png' | wc -l | tr -d ' ')"
            test "$rendered_pages" -eq "$pages"
            printf '%s\t%s\n' "$stem" "$pages" >> "$RENDERED/page-counts.tsv"
          done
          test "$(wc -l < "$RENDERED/page-counts.tsv" | tr -d ' ')" -eq 6
          test "$(find "$RENDERED" -type f -name 'page-*.png' | wc -l | tr -d ' ')" -ge 6
          cat "$RENDERED/page-counts.tsv"

      - name: Conservar evidencia M32.2
        uses: actions/upload-artifact@v4
        with:
          name: m32-2-evidencia-seis-productos
          path: ${{ runner.temp }}/m32-2
          if-no-files-found: error
          retention-days: 30
