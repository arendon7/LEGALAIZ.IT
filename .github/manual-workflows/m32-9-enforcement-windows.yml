name: M32.9 Refuerzo de integridad y RBAC

on:
  push:
    branches:
      - main
      - m32-9-gobierno-consentimientos-preferencias
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: m32-9-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforcement-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar sintaxis y conexión activa
        shell: pwsh
        run: |
          python -m py_compile `
            legalai_platform/contact_governance.py `
            legalai_platform/contact_governance_enforcement.py `
            legalai_platform/routes/m32_9_contact_governance_routes.py `
            legalai_platform/routes/m32_8_transactional_communications_routes.py `
            tests/test_m32_9_contact_governance.py `
            tests/test_m32_9_contact_governance_enforcement.py
          node --check app/modules/contact_governance_m32_9.js
          Select-String -Path legalai_platform/routes/m32_9_contact_governance_routes.py -Pattern "EnforcedContactGovernance" -Quiet | ForEach-Object { if (-not $_) { exit 1 } }
          Select-String -Path legalai_platform/routes/m32_8_transactional_communications_routes.py -Pattern "EnforcedGovernedTransactionalCommunications" -Quiet | ForEach-Object { if (-not $_) { exit 1 } }

      - name: Ejecutar gobierno base y refuerzos
        run: |
          python -m unittest tests.test_m32_9_contact_governance -v
          python -m unittest tests.test_m32_9_contact_governance_enforcement -v

      - name: Verificar que no se habilite contacto real
        shell: pwsh
        run: |
          $content = Get-Content legalai_platform/contact_governance.py -Raw
          if ($content -notmatch '"real_contact_enabled": False') { exit 1 }
          if ($content -notmatch '"legal_conclusion": False') { exit 1 }
          $enforcement = Get-Content legalai_platform/contact_governance_enforcement.py -Raw
          if ($enforcement -notmatch 'context_sha256') { exit 1 }
          if ($enforcement -notmatch 'verify_chain') { exit 1 }
