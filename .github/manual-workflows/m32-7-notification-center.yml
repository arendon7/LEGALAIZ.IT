name: M32.7 Centro de notificaciones y calendario

on:
  push:
    branches:
      - main
      - m32-7-notificaciones-escalamiento-calendario
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  centro-notificaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar sintaxis y activos M32.7
        run: |
          python -m py_compile \
            run.py \
            legalai_platform/approval_notification_center.py \
            legalai_platform/http_handler_m32_7.py \
            legalai_platform/routes/m32_7_notification_center_routes.py \
            scripts/run_m32_7_notification_center.py \
            tests/test_m32_7_notification_center.py
          node --check app/modules/notification_center_m32_7.js
          test -s app/modules/notification_center_m32_7.css
          grep -q "notification_center_m32_7.js" app/index.html
          grep -q "notification_center_m32_7.css" app/index.html
          grep -q "http_handler_m32_7 import Handler" run.py
          grep -q "http_handler_m32_6 import Handler" run.py

      - name: Ejecutar regresiones acumuladas M32.4 a M32.7
        run: |
          python -m unittest tests.test_document_approval_desk_m32_4 -v
          python -m unittest tests.test_m32_5_approval_workspace -v
          python -m unittest tests.test_m32_6_approval_operations -v
          python -m unittest tests.test_m32_7_notification_center -v

      - name: Generar evidencia integral M32.7
        run: python scripts/run_m32_7_notification_center.py --output "$RUNNER_TEMP/m32-7"

      - name: Verificar cobertura, calendarios, bandejas y cola
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'm32-7'
          payload = json.loads((root / 'm32-7-notification-center-evidence.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'M32.7'
          assert payload['synthetic_evidence'] is True
          assert payload['portfolio']['expected_products'] == 11
          assert payload['portfolio']['covered_products'] == 11
          assert payload['portfolio']['coverage_percent'] == 100
          assert payload['evaluation']['evaluated_cases'] == 11
          assert len(payload['evaluation']['created_notifications']) >= 1
          assert payload['all_inbox_metrics']['total'] >= payload['personal_inbox_metrics']['total'] >= 1
          assert payload['notification_chain']['valid'] is True
          assert payload['notification_chain']['events'] >= 1
          assert payload['business_schedule']['legal_deadline'] is False
          assert payload['business_schedule']['calendar']['holidays'] == ['2026-08-07']
          assert payload['business_schedule']['business_hours_remaining'] == 10
          assert payload['outbox_metrics']['queued'] >= 1
          assert payload['outbox_metrics']['delivered'] == 0
          assert payload['outbox_statuses'] == ['queued']
          assert payload['outbox_contains_document_content'] is False
          assert payload['outbox_recipient_addresses_stored'] is False
          assert payload['external_delivery_active'] is False
          assert payload['external_delivery_performed'] is False
          assert payload['real_external_delivery'] is False
          assert payload['real_legal_approval'] is False
          assert payload['real_qa_approval'] is False
          assert payload['statutory_deadline_calculation'] is False
          assert (root / payload['files']['events']).is_file()
          PY

      - name: Verificar arranque y protección de rutas
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/m32-7-http-runtime
          LEGAL_ALLOW_DEMO_ACCOUNTS: "true"
          LEGAL_DEMO_PASSWORD: "LegalAIZDemo2026!"
          LEGAL_REQUIRE_MFA_ROLES: ""
          LEGAL_GITHUB_LITE_ASSETS: "true"
        run: |
          mkdir -p "$LEGAL_RUNTIME_DIR"
          python run.py 8897 --lan --no-browser > "$RUNNER_TEMP/m32-7-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/m32-7-server.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8897/api/live >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat "$RUNNER_TEMP/m32-7-server.log"; exit 1; fi
          curl -fsS http://127.0.0.1:8897/modules/notification_center_m32_7.js >/dev/null
          curl -fsS http://127.0.0.1:8897/modules/notification_center_m32_7.css >/dev/null
          STATUS=$(curl -sS -o "$RUNNER_TEMP/m32-7-unauthorized.json" -w '%{http_code}' http://127.0.0.1:8897/api/m32/notification-center)
          test "$STATUS" = "401"
          grep -q 'Autenticación requerida' "$RUNNER_TEMP/m32-7-unauthorized.json"

      - name: Conservar evidencia M32.7
        uses: actions/upload-artifact@v4
        with:
          name: m32-7-centro-notificaciones-calendario
          path: |
            ${{ runner.temp }}/m32-7
            ${{ runner.temp }}/m32-7-server.log
            ${{ runner.temp }}/m32-7-unauthorized.json
          if-no-files-found: error
          retention-days: 30
