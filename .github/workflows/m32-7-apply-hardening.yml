name: M32.7 aplicar endurecimiento

on:
  push:
    branches:
      - m32-7-notificaciones-escalamiento-calendario
    paths:
      - scripts/apply_m32_7_hardening.py
      - .github/workflows/m32-7-apply-hardening.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m32-7-notificaciones-escalamiento-calendario
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar parche idempotente
        run: python scripts/apply_m32_7_hardening.py

      - name: Validar endurecimiento
        run: |
          python -m py_compile \
            legalai_platform/approval_notification_center.py \
            scripts/run_m32_7_notification_center.py \
            tests/test_m32_7_notification_center.py
          node --check app/modules/notification_center_m32_7.js
          python -m unittest tests.test_m32_7_notification_center -v

      - name: Retirar auxiliares efímeros
        run: |
          rm scripts/apply_m32_7_hardening.py
          rm .github/workflows/m32-7-apply-hardening.yml

      - name: Confirmar y publicar endurecimiento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M32.7: endurecer privacidad y agenda hábil"
          git push origin HEAD:m32-7-notificaciones-escalamiento-calendario
