name: M32.5 Aplicar cierre estricto

on:
  push:
    branches:
      - m32-5-interfaz-mesa-juridica
    paths:
      - .github/workflows/m32-5-apply-fail-closed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m32-5-interfaz-mesa-juridica
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar parche exacto
        run: python scripts/patch_m32_5_fail_closed.py
      - name: Validar sintaxis mínima
        run: |
          python -m py_compile legalai_platform/approval_desk_workspace.py legalai_platform/routes/m32_5_approval_desk_routes.py tests/test_m32_5_approval_workspace.py
          node --check app/modules/approval_desk_m32_5.js
      - name: Confirmar y retirar auxiliares
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legalai_platform/approval_desk_workspace.py legalai_platform/routes/m32_5_approval_desk_routes.py app/modules/approval_desk_m32_5.js tests/test_m32_5_approval_workspace.py .github/workflows/m32-5-approval-workspace.yml
          git rm scripts/patch_m32_5_fail_closed.py
          git rm .github/workflows/m32-5-apply-fail-closed.yml
          git commit -m "M32.5: bloquear liberación ante auditoría inválida"
          git push origin HEAD:m32-5-interfaz-mesa-juridica
