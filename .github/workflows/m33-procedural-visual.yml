name: M33.0 · QA visual segunda oleada

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
      - name: Generar seis muestras M33.0
        env:
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-procedural-runtime
        run: |
          mkdir -p "$RUNNER_TEMP/m33-procedural/samples"
          python scripts/generate_m33_0_procedural_samples.py --output "$RUNNER_TEMP/m33-procedural/samples"
          test "$(find "$RUNNER_TEMP/m33-procedural/samples" -maxdepth 1 -name '*_M33_0.docx' -type f | wc -l | tr -d ' ')" -eq 6
      - name: Convertir y rasterizar todas las páginas
        env:
          HOME: ${{ runner.temp }}/lo-home
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/m33-procedural/samples"
          RENDERED="$RUNNER_TEMP/m33-procedural/rendered"
          PROFILE="$RUNNER_TEMP/m33-procedural/lo-profile"
          mkdir -p "$HOME" "$RENDERED" "$PROFILE"
          for docx in "$SAMPLES"/*_M33_0.docx; do
            stem="$(basename "${docx%.docx}")"
            out="$RENDERED/$stem"
            mkdir -p "$out"
            libreoffice --headless "-env:UserInstallation=file://$PROFILE-$stem" --convert-to pdf --outdir "$out" "$docx"
            pdf="$out/$stem.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
            pdftoppm -png -r 120 "$pdf" "$out/page"
            rendered_pages="$(find "$out" -maxdepth 1 -name 'page-*.png' -type f | wc -l | tr -d ' ')"
            test "$rendered_pages" -eq "$pages"
            printf '%s\t%s\n' "$stem" "$pages" >> "$RENDERED/page-counts.tsv"
          done
          test "$(wc -l < "$RENDERED/page-counts.tsv" | tr -d ' ')" -eq 6
          cat "$RENDERED/page-counts.tsv"
      - name: Conservar evidencia completa
        uses: actions/upload-artifact@v4
        with:
          name: m33-0-evidencia-visual-segunda-oleada
          path: ${{ runner.temp }}/m33-procedural
          if-no-files-found: error
          retention-days: 30
