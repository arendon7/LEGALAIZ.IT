name: Contexto Graphify y Obsidian

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'infra/**'
    paths-ignore:
      - 'graphify-out/**'
      - 'project-memory/01_STATE/GRAPHIFY.md'

permissions:
  contents: write

concurrency:
  group: graphify-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Graphify
        run: python -m pip install --disable-pip-version-check 'graphifyy==0.9.29'

      - name: Construir grafo estructural local
        run: graphify extract . --code-only --force

      - name: Construir índice compacto para ChatGPT
        run: python scripts/build_graphify_index.py

      - name: Exportar vault Obsidian generado
        run: graphify export obsidian --dir graphify-out/obsidian

      - name: Registrar snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          graph = json.loads(Path('graphify-out/graph.json').read_text(encoding='utf-8'))
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', graph.get('links', []))
          sha = os.environ['GITHUB_SHA']
          ref = os.environ['GITHUB_REF_NAME']
          run_id = os.environ['GITHUB_RUN_ID']
          text = f'''---
          project: LegalAIZ.it
          type: generated-state
          status: active
          sha: {sha}
          branch: {ref}
          workflow_run: {run_id}
          ---

          # Snapshot Graphify

          - SHA: `{sha}`
          - Rama: `{ref}`
          - Workflow: `{run_id}`
          - Nodos: **{len(nodes)}**
          - Relaciones: **{len(edges)}**

          El grafo es un índice estructural generado. No reemplaza pruebas, revisión jurídica ni decisiones registradas en `project-memory/`.
          '''
          Path('project-memory/01_STATE').mkdir(parents=True, exist_ok=True)
          Path('project-memory/01_STATE/GRAPHIFY.md').write_text('\n'.join(line.strip() for line in text.splitlines()) + '\n', encoding='utf-8')
          PY

      - name: Publicar vault generado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-obsidian-${{ github.sha }}
          path: graphify-out/obsidian
          if-no-files-found: error
          retention-days: 14

      - name: Persistir snapshot compacto en la rama
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphify-out/graph.json graphify-out/CHATGPT_GRAPH_INDEX.md project-memory/01_STATE/GRAPHIFY.md
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            git add graphify-out/GRAPH_REPORT.md
          fi
          if git diff --cached --quiet; then
            echo 'Snapshot sin cambios.'
            exit 0
          fi
          git commit -m 'chore(context): refresh Graphify snapshot [skip ci]'
          git push
