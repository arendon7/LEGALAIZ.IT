name: M33.0 · Segunda oleada documental

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural-product:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CO-LA-001 · expediente laboral
            test: tests.test_m33_0_procedural_wave.ProceduralWaveM330Tests.test_labor_package_contains_seven_coordinated_documents_and_renders_strict
          - label: CO-CD-001 · hábeas data
            test: tests.test_m33_0_procedural_wave.ProceduralWaveM330Tests.test_habeas_package_sanitizes_legacy_signature_lines_and_keeps_identity_theft_conditional
          - label: CO-CD-003 · consumidor
            test: tests.test_m33_0_procedural_wave.ProceduralWaveM330Tests.test_consumer_package_emits_only_selected_substantive_mechanism
          - label: CO-CD-004 · cartera y pagaré
            test: tests.test_m33_0_procedural_wave.ProceduralWaveM330Tests.test_debt_agreement_package_reconciles_note_and_instructions_under_same_amount
          - label: Compuerta roja · no recomposición
            test: tests.test_m33_0_procedural_wave.ProceduralWaveM330Tests.test_red_case_is_not_recomposed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar control aislado
        env:
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-m33-runtime
        run: python -m unittest "${{ matrix.test }}" -v
