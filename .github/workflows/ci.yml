name: Validación LegalAIZ.it

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: legalaiz-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sintaxis
        run: python -m compileall -q .
      - name: Validar integridad y generación documental
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar interfaz y datos demo
        run: |
          node --input-type=module --check < app/modules/demo_form_values_m32.js
          node --input-type=module --check < app/modules/demo_form_data_m32.js
          node --input-type=module --check < app/modules/public_demo_m33.js
          node --input-type=module --check < app/modules/fact_review_m34_2.js
          node --input-type=module --check < app/modules/adaptive_questions_m34_3.js
          node --input-type=module --check < app/modules/recommendation_m34_4.js
          node --input-type=module --check < app/modules/account_handoff_m35_0.js
          node --input-type=module --check < app/modules/fulfillment_bridge_m35_1.js
          node --input-type=module --check < app/modules/commerce_case_m35_2.js
          node --input-type=module --check < app/modules/case_activation_m35_3.js
          grep -q 'demo_form_data_m32.css' app/index.html
          grep -q 'demo_form_data_m32.js' app/index.html
          grep -q 'public_demo_m33.css' app/index.html
          grep -q 'public_demo_m33.js' app/index.html
          grep -q 'fact_review_m34_2.css' app/index.html
          grep -q 'fact_review_m34_2.js' app/index.html
          grep -q 'adaptive_questions_m34_3.css' app/index.html
          grep -q 'adaptive_questions_m34_3.js' app/index.html
          grep -q 'recommendation_m34_4.css' app/index.html
          grep -q 'recommendation_m34_4.js' app/index.html
          grep -q 'account_handoff_m35_0.css' app/index.html
          grep -q 'account_handoff_m35_0.js' app/index.html
          grep -q 'fulfillment_bridge_m35_1.css' app/index.html
          grep -q 'fulfillment_bridge_m35_1.js' app/index.html
          grep -q 'commerce_case_m35_2.css' app/index.html
          grep -q 'commerce_case_m35_2.js' app/index.html
          grep -q 'case_activation_m35_3.css' app/index.html
          grep -q 'case_activation_m35_3.js' app/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('app/modules/demo_form_values_m32.js', 'utf8');
          const encoded = Buffer.from(source).toString('base64');
          const { buildDemoAnswers, demoAnswerSummary, isDemoQuestionVisible } = await import(`data:text/javascript;base64,${encoded}`);
          const interviews = JSON.parse(fs.readFileSync('data/interviews.json', 'utf8'));
          const failures = [];
          let questionCount = 0;
          let answerCount = 0;

          for (const [code, interview] of Object.entries(interviews)) {
            const questions = interview.questions || [];
            const answers = buildDemoAnswers(questions);
            const summary = demoAnswerSummary(questions, answers);
            questionCount += questions.length;
            answerCount += summary.answeredCount;
            if (summary.missingRequired.length) failures.push(`${code}: faltan ${summary.missingRequired.map(question => question.id).join(', ')}`);

            for (const question of questions.filter(item => isDemoQuestionVisible(item, answers))) {
              const value = answers[question.id];
              if (question.type === 'select' && !(question.options || []).includes(value)) failures.push(`${code}/${question.id}: opción inválida`);
              if (question.type === 'multiselect' && (!Array.isArray(value) || value.some(item => !(question.options || []).includes(item)))) failures.push(`${code}/${question.id}: selección múltiple inválida`);
              if (question.type === 'number' && question.min != null && Number(value) < Number(question.min)) failures.push(`${code}/${question.id}: inferior al mínimo`);
              if (question.type === 'number' && question.max != null && Number(value) > Number(question.max)) failures.push(`${code}/${question.id}: superior al máximo`);
              if (question.after_field && answers[question.after_field] && String(value) <= String(answers[question.after_field])) failures.push(`${code}/${question.id}: fecha no posterior`);
              if (question.min_length && String(value || '').length < Number(question.min_length)) failures.push(`${code}/${question.id}: texto demasiado corto`);
              if (question.max_length && String(value || '').length > Number(question.max_length)) failures.push(`${code}/${question.id}: texto demasiado largo`);
              if (question.format === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || ''))) failures.push(`${code}/${question.id}: correo inválido`);
            }
          }

          if (Object.keys(interviews).length !== 11) failures.push(`Se esperaban 11 productos y se encontraron ${Object.keys(interviews).length}`);
          if (questionCount < 473) failures.push(`La cobertura de formularios bajó de 473 a ${questionCount} preguntas`);
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Datos demo verificados: 11 productos, ${questionCount} preguntas, ${answerCount} respuestas visibles.`);
          NODE
      - name: Smoke HTTP
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-runtime
          LEGAL_ALLOW_DEMO_ACCOUNTS: 'true'
          LEGAL_REQUIRE_MFA_ROLES: ''
          LEGAL_GITHUB_LITE_ASSETS: 'true'
        run: |
          set -euo pipefail
          LEGAL_DEMO_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export LEGAL_DEMO_PASSWORD

          start_server() {
            local logfile="$1"
            python run.py --lan --no-browser > "$logfile" 2>&1 &
            PID=$!
            READY=0
            for i in {1..30}; do
              if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/live', timeout=2).read()"; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              cat "$logfile"
              return 1
            fi
          }

          stop_server() {
            if [ -n "${PID:-}" ]; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              PID=""
            fi
          }

          trap stop_server EXIT
          start_server /tmp/legalaiz.log
          python tools/m34_2_http_smoke.py
          python tools/m34_3_http_smoke.py
          python tools/m34_4_http_smoke.py
          python tools/m35_0_http_smoke.py
          python tools/m35_1_http_smoke.py
          python tools/m35_2_http_smoke.py
          python tools/m35_3_http_smoke.py
          python tools/m36_0_http_smoke.py
          python tools/m36_1_http_smoke.py

          # M36.2 necesita autenticar dos roles reales (admin + especialista).
          # Reiniciamos sólo el proceso para obtener una ventana limpia del rate limiter
          # 12/300, manteniendo LEGAL_RUNTIME_DIR, SQLite, archivos y la misma clave demo.
          # No se desactiva ni se amplía la política de autenticación.
          stop_server
          start_server /tmp/legalaiz-m36-2.log
          python tools/m36_2_http_smoke.py

          # M36.3 vuelve a recorrer asignación, aprobaciones y entrega con varios roles
          # y un segundo cliente. Se reinicia sólo el proceso para aislar el limitador
          # in-memory; se conservan runtime, SQLite y credenciales efímeras. La política
          # real de login 12/300 permanece intacta y no admite bypass de CI.
          stop_server
          start_server /tmp/legalaiz-m36-3.log
          python tools/m36_3_http_smoke.py

          # M37.0 vuelve a crear un expediente entregado y prueba inicio + tareas con
          # cliente/admin. Reiniciamos sólo el proceso: misma SQLite/runtime/clave demo,
          # pero ventana in-memory limpia. La política real de login 12/300 sigue intacta.
          stop_server
          start_server /tmp/legalaiz-m37-0.log
          python tools/m37_0_http_smoke.py

          # M37.1 recorre nuevamente revisión dual, entrega, seguimiento, upload y review
          # con cliente + especialista. El reinicio conserva estado durable y credenciales,
          # pero aísla el rate limiter in-memory sin debilitar la política real 12/300.
          stop_server
          start_server /tmp/legalaiz-m37-1.log
          python tools/m37_1_http_smoke.py
      - name: Smoke producción demostrativa M33.1
        run: python tools/public_demo_smoke.py

  visual-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
      - name: Generar muestras con fábricas activas
        run: python scripts/generate_m32_1_visual_samples.py --output "$RUNNER_TEMP/m32-1-visual/samples"
      - name: Convertir DOCX a PDF y rasterizar todas las páginas
        env:
          HOME: ${{ runner.temp }}/lo-home
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/m32-1-visual/samples"
          RENDERED="$RUNNER_TEMP/m32-1-visual/rendered"
          PROFILE="$RUNNER_TEMP/m32-1-visual/lo-profile"
          mkdir -p "$HOME" "$RENDERED" "$PROFILE"
          for docx in "$SAMPLES"/*.docx; do
            stem="$(basename "${docx%.docx}")"
            out="$RENDERED/$stem"
            mkdir -p "$out"
            libreoffice --headless "-env:UserInstallation=file://$PROFILE-$stem" --convert-to pdf --outdir "$out" "$docx"
            pdf="$out/$stem.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
            pdftoppm -png -r 120 "$pdf" "$out/page"
            rendered_pages="$(find "$out" -maxdepth 1 -name 'page-*.png' -type f | wc -l | tr -d ' ')"
            test "$rendered_pages" -eq "$pages"
            printf '%s\t%s\n' "$stem" "$pages" >> "$RENDERED/page-counts.tsv"
          done
          test "$(find "$RENDERED" -name 'page-*.png' -type f | wc -l)" -ge 2
          cat "$RENDERED/page-counts.tsv"
      - name: Conservar evidencia renderizada
        uses: actions/upload-artifact@v4
        with:
          name: m32-1-evidencia-visual-docx
          path: ${{ runner.temp }}/m32-1-visual
          if-no-files-found: error
          retention-days: 30

  graphify-context:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Graphify
        run: python -m pip install --disable-pip-version-check 'graphifyy==0.9.29'
      - name: Construir grafo estructural local
        run: graphify extract . --code-only --force
      - name: Construir índice compacto para ChatGPT
        run: python scripts/build_graphify_index.py
      - name: Exportar vault Obsidian generado
        run: graphify export obsidian --dir graphify-out/obsidian
      - name: Registrar snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          graph = json.loads(Path('graphify-out/graph.json').read_text(encoding='utf-8'))
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', graph.get('links', []))
          sha = os.environ['GITHUB_SHA']
          ref = os.environ['GITHUB_REF_NAME']
          run_id = os.environ['GITHUB_RUN_ID']
          text = f'''---
          project: LegalAIZ.it
          type: generated-state
          status: active
          sha: {sha}
          branch: {ref}
          workflow_run: {run_id}
          ---

          # Snapshot Graphify

          - SHA: `{sha}`
          - Rama fuente: `{ref}`
          - Workflow: `{run_id}`
          - Nodos: **{len(nodes)}**
          - Relaciones: **{len(edges)}**

          Este snapshot vive en la rama generada `context/graphify-snapshot`. El grafo orienta el análisis, pero no reemplaza pruebas, revisión jurídica ni decisiones registradas en `project-memory/` de `main`.
          '''
          Path('project-memory/01_STATE').mkdir(parents=True, exist_ok=True)
          Path('project-memory/01_STATE/GRAPHIFY.md').write_text('\n'.join(line.strip() for line in text.splitlines()) + '\n', encoding='utf-8')
          PY
      - name: Publicar grafo y vault como artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-context-${{ github.sha }}
          path: |
            graphify-out/graph.json
            graphify-out/CHATGPT_GRAPH_INDEX.md
            graphify-out/obsidian
            project-memory/01_STATE/GRAPHIFY.md
          if-no-files-found: error
          retention-days: 90
      - name: Publicar snapshot compacto en rama generada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f graphify-out/CHATGPT_GRAPH_INDEX.md project-memory/01_STATE/GRAPHIFY.md
          git commit -m 'chore(context): snapshot Graphify de ${{ github.sha }}'
          git push --force origin HEAD:refs/heads/context/graphify-snapshot
