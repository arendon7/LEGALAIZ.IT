name: Validación LegalAIZ.it

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: legalaiz-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sintaxis
        run: python -m compileall -q .
      - name: Validar integridad y generación documental
        env:
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-test-runtime
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/legalaiz-unittest.log"
      - name: Conservar diagnóstico de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-unittest-${{ github.run_id }}
          path: ${{ runner.temp }}/legalaiz-unittest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Validar interfaz y datos demo
        run: |
          node --input-type=module --check < app/modules/demo_form_values_m32.js
          node --input-type=module --check < app/modules/demo_form_data_m32.js
          node --input-type=module --check < app/modules/public_demo_m33.js
          grep -q 'demo_form_data_m32.css' app/index.html
          grep -q 'demo_form_data_m32.js' app/index.html
          grep -q 'public_demo_m33.css' app/index.html
          grep -q 'public_demo_m33.js' app/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('app/modules/demo_form_values_m32.js', 'utf8');
          const encoded = Buffer.from(source).toString('base64');
          const { buildDemoAnswers, demoAnswerSummary, isDemoQuestionVisible } = await import(`data:text/javascript;base64,${encoded}`);
          const interviews = JSON.parse(fs.readFileSync('data/interviews.json', 'utf8'));
          const failures = [];
          let questionCount = 0;
          let answerCount = 0;
          for (const [code, interview] of Object.entries(interviews)) {
            const questions = interview.questions || [];
            const answers = buildDemoAnswers(questions);
            const summary = demoAnswerSummary(questions, answers);
            questionCount += questions.length;
            answerCount += summary.answeredCount;
            if (summary.missingRequired.length) failures.push(`${code}: faltan ${summary.missingRequired.map(question => question.id).join(', ')}`);
            for (const question of questions.filter(item => isDemoQuestionVisible(item, answers))) {
              const value = answers[question.id];
              if (question.type === 'select' && !(question.options || []).includes(value)) failures.push(`${code}/${question.id}: opción inválida`);
              if (question.type === 'multiselect' && (!Array.isArray(value) || value.some(item => !(question.options || []).includes(item)))) failures.push(`${code}/${question.id}: selección múltiple inválida`);
              if (question.type === 'number' && question.min != null && Number(value) < Number(question.min)) failures.push(`${code}/${question.id}: inferior al mínimo`);
              if (question.type === 'number' && question.max != null && Number(value) > Number(question.max)) failures.push(`${code}/${question.id}: superior al máximo`);
              if (question.after_field && answers[question.after_field] && String(value) <= String(answers[question.after_field])) failures.push(`${code}/${question.id}: fecha no posterior`);
              if (question.min_length && String(value || '').length < Number(question.min_length)) failures.push(`${code}/${question.id}: texto demasiado corto`);
              if (question.max_length && String(value || '').length > Number(question.max_length)) failures.push(`${code}/${question.id}: texto demasiado largo`);
              if (question.format === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || ''))) failures.push(`${code}/${question.id}: correo inválido`);
            }
          }
          if (Object.keys(interviews).length !== 11) failures.push(`Se esperaban 11 productos y se encontraron ${Object.keys(interviews).length}`);
          if (questionCount < 473) failures.push(`La cobertura fuente de formularios bajó de 473 a ${questionCount} preguntas`);
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Fuente histórica verificada: 11 productos, ${questionCount} preguntas, ${answerCount} respuestas demo visibles antes de overlays runtime.`);
          NODE
      - name: Smoke HTTP
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-runtime
          LEGAL_ALLOW_DEMO_ACCOUNTS: 'true'
          LEGAL_REQUIRE_MFA_ROLES: ''
          LEGAL_GITHUB_LITE_ASSETS: 'true'
        run: |
          set -euo pipefail
          python run.py --lan --no-browser > /tmp/legalaiz.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/live', timeout=2).read()"; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/legalaiz.log
            exit 1
          fi
          python <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen('http://127.0.0.1:8765/api/products/CO-CD-001', timeout=5) as response:
              payload = json.load(response)
          interview = payload.get('interview') or {}
          questions = interview.get('questions') or []
          by_id = {}
          for question in questions:
              by_id.setdefault(question.get('id'), []).append(question)

          identity = by_id.get('prior_claim_identity_theft') or []
          if len(identity) != 1:
              raise SystemExit(f"M33.3: se esperaba una prior_claim_identity_theft y se encontraron {len(identity)}")
          if identity[0].get('show_if') != {'field': 'prior_claim', 'equals': 'Sí'}:
              raise SystemExit(f"M33.3: condición de suplantación inesperada: {identity[0].get('show_if')!r}")
          if identity[0].get('options') != ['Sí', 'No', 'No sé']:
              raise SystemExit(f"M33.3: opciones de suplantación inesperadas: {identity[0].get('options')!r}")

          communication_ids = [
              'prior_communication_sent',
              'prior_communication_channel',
              'prior_communication_destination_verified',
              'prior_communication_alternative_channel_agreed',
              'prior_communication_message_consultable',
              'prior_communication_content_sufficient',
              'prior_communication_first_date',
          ]
          for field in communication_ids:
              matches = by_id.get(field) or []
              if len(matches) != 1:
                  raise SystemExit(f"M33.3: se esperaba una {field} y se encontraron {len(matches)}")

          send = by_id['prior_communication_sent'][0]
          if send.get('options') != ['Sí', 'No', 'No sé']:
              raise SystemExit(f"M33.3: opciones de envío inesperadas: {send.get('options')!r}")
          for field in [
              'prior_communication_channel',
              'prior_communication_destination_verified',
              'prior_communication_alternative_channel_agreed',
              'prior_communication_message_consultable',
              'prior_communication_content_sufficient',
          ]:
              if by_id[field][0].get('show_if') != {'field': 'prior_communication_sent', 'equals': 'Sí'}:
                  raise SystemExit(f"M33.3: condición inesperada en {field}: {by_id[field][0].get('show_if')!r}")
          if by_id['prior_communication_first_date'][0].get('show_if') != {'field': 'small_obligation_two_notices', 'equals': 'Sí'}:
              raise SystemExit("M33.3: la primera fecha de pequeña cuantía no depende de la regla de dos avisos")

          send_date = by_id.get('prior_communication_date') or []
          if len(send_date) != 1 or 'envío' not in str(send_date[0].get('label') or '').casefold():
              raise SystemExit("M33.3: prior_communication_date no está presentada como fecha de envío")
          if interview.get('interview_standard') != 'M33.3':
              raise SystemExit(f"M33.3: estándar de entrevista no activo: {interview.get('interview_standard')!r}")
          if len(questions) < 60:
              raise SystemExit(f"M33.3: entrevista CO-CD-001 incompleta; solo {len(questions)} preguntas activas")

          print(
              f"Entrevista runtime CO-CD-001 verificada: {len(questions)} preguntas; "
              "suplantación y comunicación previa se sirven una sola vez bajo M33.3."
          )
          PY
      - name: Smoke producción demostrativa M33.1
        env:
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-public-demo-runtime
        run: python tools/public_demo_smoke.py

  visual-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
      - name: Generar portafolio visual M33.0 sobre runtime M33.1
        env:
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-visual-runtime
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/document-visual/samples"
          mkdir -p "$ROOT/historical" "$ROOT/contracts" "$ROOT/procedural" "$ROOT/wave3"
          python scripts/generate_m32_1_visual_samples.py --output "$ROOT/historical"
          python scripts/generate_m33_0_contractual_samples.py --output "$ROOT/contracts"
          python scripts/generate_m33_0_procedural_samples.py --output "$ROOT/procedural"
          python scripts/generate_m33_0_wave3_samples.py --output "$ROOT/wave3"
          test "$(find "$ROOT/contracts" -maxdepth 1 -name '*_M33_0.docx' -type f | wc -l | tr -d ' ')" -eq 4
          test "$(find "$ROOT/procedural" -maxdepth 1 -name '*_M33_0.docx' -type f | wc -l | tr -d ' ')" -eq 27
          test "$(find "$ROOT/wave3" -maxdepth 1 -name '*_M33_0.docx' -type f | wc -l | tr -d ' ')" -eq 22
          test "$(find "$ROOT" -name '*_M33_0.docx' -type f | wc -l | tr -d ' ')" -eq 53
          python scripts/audit_m33_2_editorial_portfolio.py \
            --samples "$ROOT" \
            --output "$RUNNER_TEMP/document-visual/m33-2-editorial-audit.json"
      - name: Convertir DOCX a PDF y rasterizar todas las páginas
        env:
          HOME: ${{ runner.temp }}/lo-home
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/document-visual/samples"
          RENDERED="$RUNNER_TEMP/document-visual/rendered"
          PROFILE="$RUNNER_TEMP/document-visual/lo-profile"
          mkdir -p "$HOME" "$RENDERED" "$PROFILE"
          while IFS= read -r -d '' docx; do
            group="$(basename "$(dirname "$docx")")"
            stem="$(basename "${docx%.docx}")"
            out="$RENDERED/$group/$stem"
            mkdir -p "$out"
            libreoffice --headless "-env:UserInstallation=file://$PROFILE-$group-$stem" --convert-to pdf --outdir "$out" "$docx"
            pdf="$out/$stem.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
            pdftoppm -png -r 120 "$pdf" "$out/page"
            rendered_pages="$(find "$out" -maxdepth 1 -name 'page-*.png' -type f | wc -l | tr -d ' ')"
            test "$rendered_pages" -eq "$pages"
            printf '%s/%s\t%s\n' "$group" "$stem" "$pages" >> "$RENDERED/page-counts.tsv"
          done < <(find "$SAMPLES" -name '*.docx' -type f -print0 | sort -z)
          test "$(find "$RENDERED" -name 'page-*.png' -type f | wc -l)" -ge 53
          test "$(grep -c '_M33_0' "$RENDERED/page-counts.tsv")" -eq 53
          python scripts/check_rendered_blank_pages.py "$RENDERED"
          python scripts/check_m33_2_sparse_signature_tails.py "$RENDERED" \
            --output "$RENDERED/m33-2-sparse-signature-tails.json"
          cat "$RENDERED/page-counts.tsv"
      - name: Conservar evidencia renderizada
        uses: actions/upload-artifact@v4
        with:
          name: m33-0-evidencia-visual-docx
          path: ${{ runner.temp }}/document-visual
          if-no-files-found: error
          retention-days: 30
