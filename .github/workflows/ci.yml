name: Validación LegalAIZ.it

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: legalaiz-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sintaxis
        run: python -m compileall -q .
      - name: Validar integridad y generación documental
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar interfaz y datos demo
        run: |
          node --input-type=module --check < app/modules/demo_form_values_m32.js
          node --input-type=module --check < app/modules/demo_form_data_m32.js
          grep -q 'demo_form_data_m32.css' app/index.html
          grep -q 'demo_form_data_m32.js' app/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync('app/modules/demo_form_values_m32.js', 'utf8');
          const encoded = Buffer.from(source).toString('base64');
          const { buildDemoAnswers, demoAnswerSummary, isDemoQuestionVisible } = await import(`data:text/javascript;base64,${encoded}`);
          const interviews = JSON.parse(fs.readFileSync('data/interviews.json', 'utf8'));
          const failures = [];
          let questionCount = 0;
          let answerCount = 0;

          for (const [code, interview] of Object.entries(interviews)) {
            const questions = interview.questions || [];
            const answers = buildDemoAnswers(questions);
            const summary = demoAnswerSummary(questions, answers);
            questionCount += questions.length;
            answerCount += summary.answeredCount;
            if (summary.missingRequired.length) failures.push(`${code}: faltan ${summary.missingRequired.map(question => question.id).join(', ')}`);

            for (const question of questions.filter(item => isDemoQuestionVisible(item, answers))) {
              const value = answers[question.id];
              if (question.type === 'select' && !(question.options || []).includes(value)) failures.push(`${code}/${question.id}: opción inválida`);
              if (question.type === 'multiselect' && (!Array.isArray(value) || value.some(item => !(question.options || []).includes(item)))) failures.push(`${code}/${question.id}: selección múltiple inválida`);
              if (question.type === 'number' && question.min != null && Number(value) < Number(question.min)) failures.push(`${code}/${question.id}: inferior al mínimo`);
              if (question.type === 'number' && question.max != null && Number(value) > Number(question.max)) failures.push(`${code}/${question.id}: superior al máximo`);
              if (question.after_field && answers[question.after_field] && String(value) <= String(answers[question.after_field])) failures.push(`${code}/${question.id}: fecha no posterior`);
              if (question.min_length && String(value || '').length < Number(question.min_length)) failures.push(`${code}/${question.id}: texto demasiado corto`);
              if (question.max_length && String(value || '').length > Number(question.max_length)) failures.push(`${code}/${question.id}: texto demasiado largo`);
              if (question.format === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || ''))) failures.push(`${code}/${question.id}: correo inválido`);
            }
          }

          if (Object.keys(interviews).length !== 11) failures.push(`Se esperaban 11 productos y se encontraron ${Object.keys(interviews).length}`);
          if (questionCount < 473) failures.push(`La cobertura de formularios bajó de 473 a ${questionCount} preguntas`);
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(`Datos demo verificados: 11 productos, ${questionCount} preguntas, ${answerCount} respuestas visibles.`);
          NODE
      - name: Smoke HTTP
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/legalaiz-runtime
          LEGAL_ALLOW_DEMO_ACCOUNTS: 'true'
          LEGAL_DEMO_PASSWORD: 'LegalAIZDemo2026!'
          LEGAL_REQUIRE_MFA_ROLES: ''
          LEGAL_GITHUB_LITE_ASSETS: 'true'
        run: |
          python run.py --lan --no-browser > /tmp/legalaiz.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/live', timeout=2).read()" && exit 0 || true
            sleep 1
          done
          cat /tmp/legalaiz.log
          exit 1

  visual-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
      - name: Generar muestras con fábricas activas
        run: python scripts/generate_m32_1_visual_samples.py --output "$RUNNER_TEMP/m32-1-visual/samples"
      - name: Convertir DOCX a PDF y rasterizar todas las páginas
        env:
          HOME: ${{ runner.temp }}/lo-home
        run: |
          set -euo pipefail
          SAMPLES="$RUNNER_TEMP/m32-1-visual/samples"
          RENDERED="$RUNNER_TEMP/m32-1-visual/rendered"
          PROFILE="$RUNNER_TEMP/m32-1-visual/lo-profile"
          mkdir -p "$HOME" "$RENDERED" "$PROFILE"
          for docx in "$SAMPLES"/*.docx; do
            stem="$(basename "${docx%.docx}")"
            out="$RENDERED/$stem"
            mkdir -p "$out"
            libreoffice --headless "-env:UserInstallation=file://$PROFILE-$stem" --convert-to pdf --outdir "$out" "$docx"
            pdf="$out/$stem.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test -n "$pages"
            test "$pages" -ge 1
            pdftoppm -png -r 120 "$pdf" "$out/page"
            rendered_pages="$(find "$out" -maxdepth 1 -name 'page-*.png' -type f | wc -l | tr -d ' ')"
            test "$rendered_pages" -eq "$pages"
            printf '%s\t%s\n' "$stem" "$pages" >> "$RENDERED/page-counts.tsv"
          done
          test "$(find "$RENDERED" -name 'page-*.png' -type f | wc -l)" -ge 2
          cat "$RENDERED/page-counts.tsv"
      - name: Conservar evidencia renderizada
        uses: actions/upload-artifact@v4
        with:
          name: m32-1-evidencia-visual-docx
          path: ${{ runner.temp }}/m32-1-visual
          if-no-files-found: error
          retention-days: 30
