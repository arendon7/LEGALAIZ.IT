name: M32.4 Mesa de aprobación por hash

on:
  push:
    branches:
      - main
      - m32-4-mesa-aprobacion-hash
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mesa-aprobacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar regresiones M32.4
        run: python -m unittest tests.test_document_approval_desk_m32_4 -v

      - name: Ejecutar ciclo integral sintético
        run: python scripts/run_m32_4_approval_lifecycle.py --output "$RUNNER_TEMP/m32-4"

      - name: Verificar liberación por hash y separación de funciones
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'm32-4'
          payload = json.loads((root / 'm32-4-lifecycle.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'M32.4'
          assert payload['revision_count'] == 2
          assert payload['current_revision_id'] == payload['released_revision_id']
          assert len(payload['released_sha256']) == 64
          assert payload['blocked_before_resolution'] is True
          assert payload['legal_actor'] != payload['qa_actor']
          assert payload['release_status'] == 'released_exact_hash'
          assert payload['audit']['valid'] is True
          assert payload['audit']['events'] >= 10
          assert payload['real_legal_approval'] is False
          assert payload['real_qa_approval'] is False

          case_root = root / 'approval-desk' / payload['case_id']
          case = json.loads((case_root / 'case.json').read_text(encoding='utf-8'))
          assert case['status'] == 'released'
          assert case['release_id']
          revisions = sorted((case_root / 'revisions').glob('REV-*/revision.json'))
          assert len(revisions) == 2
          current = json.loads(revisions[-1].read_text(encoding='utf-8'))
          assert current['sha256'] == payload['released_sha256']
          release = json.loads(
              (case_root / 'releases' / case['release_id'] / 'release.json').read_text(encoding='utf-8')
          )
          released_file = case_root / 'releases' / case['release_id'] / release['filename']
          assert released_file.is_file()
          assert release['sha256'] == payload['released_sha256']
          assert release['legal_approval_record_hash'] != release['qa_approval_record_hash']
          PY

      - name: Conservar evidencia M32.4
        uses: actions/upload-artifact@v4
        with:
          name: m32-4-mesa-aprobacion-hash
          path: ${{ runner.temp }}/m32-4
          if-no-files-found: error
          retention-days: 30
