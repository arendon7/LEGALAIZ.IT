name: M32.5 Aplicar nombre seguro DOCX

on:
  push:
    branches:
      - m32-5-interfaz-mesa-juridica
    paths:
      - .github/workflows/m32-5-apply-upload-name.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m32-5-interfaz-mesa-juridica
          fetch-depth: 0
      - name: Aplicar migración exacta
        run: python scripts/patch_m32_5_upload_name.py
      - name: Confirmar y retirar auxiliares
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legalai_platform/approval_desk_workspace.py
          git rm scripts/patch_m32_5_upload_name.py
          git rm .github/workflows/m32-5-apply-upload-name.yml
          git commit -m "M32.5: conservar nombre seguro de revisiones cargadas"
          git push origin HEAD:m32-5-interfaz-mesa-juridica
