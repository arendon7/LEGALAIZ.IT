name: Verificar transferencia LegalAIZ.it M31.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-m31-8.yml'

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar bloque binario
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from urllib.request import Request, urlopen
          from PIL import Image
          import hashlib, io
          url = 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff302831d-f305-4fbb-b1d5-0f30d498a8b9/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANuwdAEUNhVixs3lBXBzkG9P6qCqYsRHw63aqDCiQUhI&exp=1785895118&osig=AAAAAAAAAAAAAAAAAAAAAEVV7pAQomXdxn36dGfnvyqblMgGXLbxn6mwVL9Jh2oS&signer=media-rpc&x-canva-quality=thumbnail'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.canva.com/'})
          with urlopen(req,timeout=40) as r: data=r.read()
          raw=Image.open(io.BytesIO(data)).convert('RGB').tobytes()
          digest=hashlib.sha256(raw).hexdigest()
          print('dimensiones=',len(raw),'sha=',digest,'cabecera=',raw[:24].hex())
          assert digest == '35d2cc2abee5a0710811c67ec5f42318efa4474210ad3ffe7bb38a672736f8b8'
          PY
