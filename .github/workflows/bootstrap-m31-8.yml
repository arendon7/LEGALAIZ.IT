name: Publicar LegalAIZ.it M31.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-m31-8.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar paquete verificado
        env:
          EXPECTED_SHA256: 8eacac346892b8ef545e8fe21bc562f65425076b01e9181b2f7f990c6c52cef8
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 \
            'https://drive.usercontent.google.com/download?id=1hHUJBpIvC_hPyZ5sSt6IVhzd20JVgOkE&export=download&confirm=t' \
            -o /tmp/legalaiz.tar.xz
          echo "$EXPECTED_SHA256  /tmp/legalaiz.tar.xz" | sha256sum -c -

      - name: Publicar árbol fuente
        run: |
          rm -rf /tmp/legalaiz-unpack
          mkdir -p /tmp/legalaiz-unpack
          tar -xJf /tmp/legalaiz.tar.xz -C /tmp/legalaiz-unpack
          rsync -a --delete --exclude='.git' /tmp/legalaiz-unpack/legalaiz_runtime_repo_text/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-m31-8.yml

      - name: Validar sintaxis
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_GITHUB_LITE_ASSETS: 'true'
        run: python -m compileall -q .

      - name: Confirmar publicación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar LegalAIZ.it M31.8 v5.0.7"
          git push
