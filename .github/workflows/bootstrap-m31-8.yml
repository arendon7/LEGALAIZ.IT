name: Publicar LegalAIZ.it M31.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-m31-8.yml'
      - '.bootstrap/publish_m31_8.py'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir y publicar paquete
        run: |
          python -m pip install --quiet pillow
          python .bootstrap/publish_m31_8.py

      - name: Validar sintaxis
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_GITHUB_LITE_ASSETS: 'true'
        run: python -m compileall -q .

      - name: Confirmar publicación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar LegalAIZ.it M31.8 v5.0.7"
          git push
