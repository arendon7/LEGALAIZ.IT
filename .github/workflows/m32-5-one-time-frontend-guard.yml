name: M32.5 Ajuste único de guardia frontend

on:
  push:
    branches:
      - m32-5-interfaz-mesa-juridica
    paths:
      - .github/workflows/m32-5-one-time-frontend-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m32-5-interfaz-mesa-juridica
          fetch-depth: 0
      - name: Evitar ciclos de renderizado propios
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/modules/approval_desk_m32_5.js')
          text = path.read_text(encoding='utf-8')
          old_route = """async function route(force=false) {
            if (!currentPath().startsWith(ROUTE)) return;
            ensureNavigation();
            if (!mainNode()) return setTimeout(()=>route(force),80);
            if (!professional()) return accessDenied();
            try {
              loading();
              const caseId=currentCaseId();
              if (caseId) await renderDetail(caseId,force); else await renderList(force);
            } catch (error) { errorPanel(error); }
          }"""
          new_route = """async function route(force=false) {
            if (!currentPath().startsWith(ROUTE) || local.rendering) return;
            local.rendering=true;
            try {
              ensureNavigation();
              if (!mainNode()) { setTimeout(()=>route(force),80); return; }
              if (!professional()) { accessDenied(); return; }
              loading();
              const caseId=currentCaseId();
              if (caseId) await renderDetail(caseId,force); else await renderList(force);
            } catch (error) { errorPanel(error); }
            finally { local.rendering=false; }
          }"""
          old_observer = """const observer=new MutationObserver(()=>schedule(false));
          observer.observe(app,{childList:true,subtree:true});"""
          new_observer = """const observer=new MutationObserver(()=>{
            ensureNavigation();
            if (currentPath().startsWith(ROUTE) && !document.querySelector('.m325-page') && !local.rendering) schedule(false);
          });
          observer.observe(app,{childList:true,subtree:true});"""
          if old_route not in text or old_observer not in text:
              raise SystemExit('No se encontraron los bloques exactos que debían protegerse.')
          path.write_text(text.replace(old_route,new_route).replace(old_observer,new_observer),encoding='utf-8')
          PY
      - name: Confirmar cambio en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/approval_desk_m32_5.js
          git commit -m "M32.5: evitar ciclos de renderizado de la mesa jurídica"
          git push origin HEAD:m32-5-interfaz-mesa-juridica
