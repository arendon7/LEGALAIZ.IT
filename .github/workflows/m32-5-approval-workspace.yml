name: M32.5 Interfaz de Mesa Jurídica

on:
  push:
    branches:
      - main
      - m32-5-interfaz-mesa-juridica
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mesa-juridica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Validar sintaxis y activos M32.5
        run: |
          python -m py_compile \
            run.py \
            legalai_platform/approval_desk_workspace.py \
            legalai_platform/http_handler_m32_5.py \
            legalai_platform/routes/m32_5_approval_desk_routes.py \
            scripts/run_m32_5_approval_workspace.py \
            tests/test_m32_5_approval_workspace.py
          node --check app/modules/approval_desk_m32_5.js
          test -s app/modules/approval_desk_m32_5.css
          grep -q "approval_desk_m32_5.js" app/index.html
          grep -q "approval_desk_m32_5.css" app/index.html

      - name: Ejecutar regresiones M32.4 y M32.5
        run: |
          python -m unittest tests.test_document_approval_desk_m32_4 -v
          python -m unittest tests.test_m32_5_approval_workspace -v

      - name: Instalar motor de renderizado
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core

      - name: Ejecutar ciclo integral de la interfaz operativa
        run: python scripts/run_m32_5_approval_workspace.py --output "$RUNNER_TEMP/m32-5"

      - name: Verificar paginación, hashes, RBAC y gobierno
        run: |
          python - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path
          from pypdf import PdfReader

          root = Path(os.environ['RUNNER_TEMP']) / 'm32-5'
          payload = json.loads((root / 'm32-5-workspace-evidence.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'M32.5'
          assert payload['revision_count'] == 2
          assert payload['current_revision_id'] == payload['released_revision_id']
          assert payload['rendered_preview'] is True
          assert payload['rendering_engine'] == 'LibreOffice'
          assert payload['page_count'] >= 2
          assert payload['comparison_changed'] is True
          assert payload['comparison']['added_lines'] >= 1
          assert payload['approval_blocked_before_resolution'] is True
          assert payload['finding_resolution_state'] == 'resolved'
          assert payload['separation_of_functions'] is True
          assert payload['legal_actor'] != payload['qa_actor']
          assert payload['workflow_status'] == 'released'
          assert payload['audit']['valid'] is True
          assert payload['summary_metrics']['released'] == 1
          assert payload['real_legal_approval'] is False
          assert payload['real_qa_approval'] is False
          hashes = {
              payload['current_sha256'],
              payload['released_sha256'],
              payload['released_physical_sha256'],
              payload['released_manifest_sha256'],
          }
          assert len(hashes) == 1
          released = root / payload['files']['released_docx']
          preview = root / payload['files']['preview_pdf']
          assert released.is_file() and preview.is_file()
          assert sha256(released.read_bytes()).hexdigest() == payload['released_sha256']
          assert len(PdfReader(str(preview)).pages) == payload['page_count']
          PY
          unzip -t "$RUNNER_TEMP/m32-5/M32_5_Acuerdo_Demostrativo_v2.docx"
          pdfinfo "$RUNNER_TEMP/m32-5/M32_5_Vista_Paginada.pdf" | grep -E '^Pages:[[:space:]]+[2-9][0-9]*$'

      - name: Verificar arranque y protección de la ruta
        env:
          LEGAL_PROFILE: local
          LEGAL_APP_ENV: demo
          LEGAL_RUNTIME_DIR: ${{ runner.temp }}/m32-5-http-runtime
          LEGAL_ALLOW_DEMO_ACCOUNTS: "true"
          LEGAL_DEMO_PASSWORD: "LegalAIZDemo2026!"
          LEGAL_REQUIRE_MFA_ROLES: ""
          LEGAL_GITHUB_LITE_ASSETS: "true"
        run: |
          mkdir -p "$LEGAL_RUNTIME_DIR"
          python run.py 8895 --lan --no-browser > "$RUNNER_TEMP/m32-5-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/m32-5-server.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8895/api/live >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat "$RUNNER_TEMP/m32-5-server.log"; exit 1; fi
          curl -fsS http://127.0.0.1:8895/modules/approval_desk_m32_5.js >/dev/null
          curl -fsS http://127.0.0.1:8895/modules/approval_desk_m32_5.css >/dev/null
          STATUS=$(curl -sS -o "$RUNNER_TEMP/m32-5-unauthorized.json" -w '%{http_code}' http://127.0.0.1:8895/api/m32/approval-desk)
          test "$STATUS" = "401"
          grep -q 'Autenticación requerida' "$RUNNER_TEMP/m32-5-unauthorized.json"

      - name: Conservar evidencia M32.5
        uses: actions/upload-artifact@v4
        with:
          name: m32-5-interfaz-mesa-juridica
          path: |
            ${{ runner.temp }}/m32-5
            ${{ runner.temp }}/m32-5-server.log
            ${{ runner.temp }}/m32-5-unauthorized.json
          if-no-files-found: error
          retention-days: 30
