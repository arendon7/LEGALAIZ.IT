name: M32.5 Aplicar código fail-closed

on:
  push:
    branches:
      - m32-5-interfaz-mesa-juridica
    paths:
      - .github/workflows/m32-5-apply-code-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m32-5-interfaz-mesa-juridica
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construir parche de código sin modificar workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/patch_m32_5_fail_closed.py').read_text(encoding='utf-8')
          marker = '\nreplace_exact(\n    ".github/workflows/m32-5-approval-workspace.yml",'
          if marker not in source:
              raise SystemExit('No se encontró el límite del parche de workflow.')
          code_only = source.split(marker, 1)[0] + '\nprint("Parche de código M32.5 aplicado.")\n'
          Path('/tmp/patch_m32_5_code_only.py').write_text(code_only, encoding='utf-8')
          PY
          python /tmp/patch_m32_5_code_only.py
      - name: Validar sintaxis mínima
        run: |
          python -m py_compile legalai_platform/approval_desk_workspace.py legalai_platform/routes/m32_5_approval_desk_routes.py tests/test_m32_5_approval_workspace.py
          node --check app/modules/approval_desk_m32_5.js
      - name: Confirmar únicamente código y pruebas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legalai_platform/approval_desk_workspace.py legalai_platform/routes/m32_5_approval_desk_routes.py app/modules/approval_desk_m32_5.js tests/test_m32_5_approval_workspace.py
          git commit -m "M32.5: bloquear liberación ante auditoría inválida"
          git push origin HEAD:m32-5-interfaz-mesa-juridica
